name: Monitor iPhone 18 Pro Max

# Checa o estoque a cada ~5 min. Quando o 18 Pro Max 256GB aparece disponivel em
# Brickell City Centre ou Miami Worldcenter, o job FALHA de proposito para o GitHub mandar e-mail de aviso.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-iphone
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
    steps:
      - uses: actions/checkout@v4
      - name: Checar estoque
        run: python3 scripts/monitor_iphone.py --uma-vez --falhar-se-disponivel --modelo "18 Pro Max 256GB" --lojas Brickell --lojas Worldcenter
      - name: Push no celular (opcional, secret NTFY_TOPICO)
        if: failure() && env.NTFY_TOPICO != ''
        run: |
          curl -s -H "Title: iPhone disponivel" -H "Priority: high" \
            -d "iPhone 18 Pro Max 256/512GB disponivel - veja o log do GitHub Actions" \
            "https://ntfy.sh/$NTFY_TOPICO"
