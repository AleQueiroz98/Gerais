name: Monitor iPhone

# Checa o estoque a cada ~5 min. Quando o 18 Pro Max 256GB aparece disponivel em
# Brickell City Centre ou Miami Worldcenter, o job FALHA de proposito para o GitHub
# mandar e-mail de aviso.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Checar estoque
        run: python3 scripts/monitor_iphone.py --uma-vez --falhar-se-disponivel --modelo "18 Pro Max 256GB" --lojas Brickell --lojas Worldcenter
